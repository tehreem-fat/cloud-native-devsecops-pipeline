name: Trivy Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 3️⃣ Build Docker image
      - name: Build Docker image
        run: docker build -t cloud-native-devsecops-app:1.0 .

      # 4️⃣ Trivy container scan
      - name: Trivy Container Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cloud-native-devsecops-app:1.0
          format: json
          output: trivy-report.json
          scan-type: image

      # 5️⃣ Python dependency check
      - name: Python Dependency Check
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit > pip-audit-report.txt || true

      # 6️⃣ Upload Trivy JSON report
      - name: Upload Trivy report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json

      # 7️⃣ Upload Python dependency report
      - name: Upload pip-audit report
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.txt

      # 8️⃣ Log HIGH severity vulnerabilities (without failing workflow)
      - name: Check HIGH severity vulnerabilities
        run: |
          if jq '.Results[].Vulnerabilities[]? | select(.Severity=="HIGH")' trivy-report.json | grep -q .; then
            echo "❌ HIGH severity vulnerability found in Docker image!"
          else
            echo "✅ No HIGH severity vulnerabilities found in Docker image."
          fi

      # 9️⃣ Log HIGH/CRITICAL Python dependency vulnerabilities (without failing)
      - name: Check HIGH/CRITICAL Python dependency vulnerabilities
        run: |
          if grep -E "HIGH|CRITICAL" pip-audit-report.txt; then
            echo "❌ HIGH or CRITICAL vulnerability found in Python dependencies!"
          else
            echo "✅ No HIGH or CRITICAL vulnerabilities found in Python dependencies."
          fi
